# penkit — pinned tool versions
#
# Single source of truth: "penkit install" installs these versions and "penkit audit"
# refuses to run a tool that does not match.
# Checksums collected and verified on 2026-11-11 (checksum files published by each
# project, or the GitHub release digest when there is none).
#
# Changing a version: update version, commit and checksums together.
#   commit: git ls-remote https://github.com/<org>/<repo> "refs/tags/vX.Y.Z*"
#           (the ^{} line if there is one, otherwise the only line)

[betterleaks]
version = "1.9.0"
commit = "81aff7a638638aae3a659845d089043e1d8fe9ac"
repo = "https://github.com/betterleaks/betterleaks"
url = "https://github.com/betterleaks/betterleaks/releases/download/v{version}/betterleaks_{version}_linux_{arch}.tar.gz"
arch = { x86_64 = "x64", aarch64 = "arm64" }
# archive checksum (checksums.txt of the release)
archive_sha256 = { x86_64 = "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7", aarch64 = "1d39116e0a58dc94574715e2aa12a2dbd5062f193eee3fec011fef6ba06bd13b" }
# checksum of the binary extracted from this archive
binary_sha256 = { x86_64 = "0ace40b41652344608f89967fe93c6caf4faae9a4df20423632c7efb02a4d4e1" }

[semgrep]
version = "1.182.0"
pipx_spec = "semgrep==1.182.0"

